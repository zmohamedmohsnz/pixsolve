services:
  mongodb:
    image: mongo:8.0
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  redis:
    image: redis:8.2.9-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  api:
    build:
      context: .
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_URI: mongodb://mongodb:27017/pixsolve
      REDIS_URL: redis://redis:6379
      PUBLIC_APP_URL: http://localhost:8080
      ALLOWED_ORIGINS: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:3000/health')
          .then(response => process.exit(response.ok ? 0 : 1))
          .catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  worker:
    build:
      context: .
    command: ["npm", "run", "worker"]
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_URI: mongodb://mongodb:27017/pixsolve
      REDIS_URL: redis://redis:6379
      PUBLIC_APP_URL: http://localhost:8080
      ALLOWED_ORIGINS: http://localhost:8080
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:3000/api/v1
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  mongodb-data: